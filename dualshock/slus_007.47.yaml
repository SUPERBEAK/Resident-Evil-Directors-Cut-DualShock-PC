      - [0x2CFE4, c, player]
      - [0x314E8, c, player_weapon]
      - [0x357C0, c, player_scd]
      - [0x36BAC, c, room]
      - [0x37874, c, scd]
      - [0x3B94C, c, interactive_screen]
      - [0x3C3A4, c, computer_lab_terminal]
      - [0x3EF1C, c, computer_lab]
      - [0x4210C, c, room_collision]
      - [0x43970, c, sound]
      - [0x45B0C, c, stage_load]
      - [0x45CF0, c, status_menu]
      - [0x4AAF0, c, npc]
      - [0x4D03C, c, texture]
      - [0x4D414, c, movie]
      - [0x4EAAC, c, game_reset]
      - [0x4EB80, c, entity_common]
      - [0x51188, c, tyrant_trail]
      - [0x52080, asm, psyq]          # 0x80061880 Sony PsyQ libraries (2MBYTE.OBJ __main first)
      - [0x8013C, data, data]         # 0x8008F93C data (start estimated by splat)
  - [0xA3000]
